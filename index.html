<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFSULDEMINAS - Categorizador de Flores</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
    crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="page-header">
    <div class="container text-center">
      <h1>IFSULDEMINAS - Categorizador de Flores</h1>
      <p>Campus Machado | Willian Silvestre</p>
    </div>
  </header>

  <main class="container main-content text-center">
    <div class="load-image">
      <img id="preview" src="image1.png" alt="Pré-visualização" />
    </div>

    <div class="send-image">
      <label for="image_ts">
        <span id="location-src">Clique para adicionar sua imagem</span>
        <input type="file" name="image" id="image_ts" onchange="previewImage()" />
      </label>
      <button class="btn-send" onclick="init()">Enviar</button>
    </div>

    <div class="result-display" id="label-container"></div>
  </main>

  <footer class="footer">
    Todos direitos reservados - Departamento de Computação - IFSULDEMINAS - Campus Machado
  </footer>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
</body>
</html>
